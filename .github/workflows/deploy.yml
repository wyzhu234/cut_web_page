# GitHub Pages 自动部署
# 每次 push 到 main 分支自动发布到 GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 仅当 HTML 文件变更时才触发部署，避免无用构建
    paths:
      - '**.html'

  # 允许手动触发部署
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署，避免冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 自动生成导航页（递归扫描所有 HTML）
        run: python scripts/generate_nav.py

      - name: 配置 Pages
        uses: actions/configure-pages@v4

      - name: 上传整站 HTML 文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
