# GitHub Pages 自动部署
# 每次 push 到 master 分支自动发布到 GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

  # 允许手动触发部署
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署，避免冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v4

      - name: 上传整站 HTML 文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
